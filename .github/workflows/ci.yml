name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest --cov=app --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependency-review:
    name: Dependency scanning (Dependabot / dependency review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      dev-tag: ${{ steps.meta.outputs.dev_tag }}
      staging-tag: ${{ steps.meta.outputs.staging_tag }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: |
          echo "tag=ghcr.io/theadonata/stock-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "dev_tag=ghcr.io/theadonata/stock-backend:dev" >> "$GITHUB_OUTPUT"
          echo "staging_tag=ghcr.io/theadonata/stock-backend:staging" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t ${{ steps.meta.outputs.tag }} -t ${{ steps.meta.outputs.dev_tag }} -t ${{ steps.meta.outputs.staging_tag }} .

      - name: Save image as artifact
        run: docker save ${{ steps.meta.outputs.tag }} ${{ steps.meta.outputs.dev_tag }} ${{ steps.meta.outputs.staging_tag }} -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: image.tar
          retention-days: 1

  build-db-image:
    name: Build database image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      dev-tag: ${{ steps.meta.outputs.dev_tag }}
      staging-tag: ${{ steps.meta.outputs.staging_tag }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: |
          echo "tag=ghcr.io/theadonata/stock-backend-db:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "dev_tag=ghcr.io/theadonata/stock-backend-db:dev" >> "$GITHUB_OUTPUT"
          echo "staging_tag=ghcr.io/theadonata/stock-backend-db:staging" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t ${{ steps.meta.outputs.tag }} -t ${{ steps.meta.outputs.dev_tag }} -t ${{ steps.meta.outputs.staging_tag }} ./db

      - name: Save image as artifact
        run: docker save ${{ steps.meta.outputs.tag }} ${{ steps.meta.outputs.dev_tag }} ${{ steps.meta.outputs.staging_tag }} -o db-image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: backend-db-image
          path: db-image.tar
          retention-days: 1

  trivy-scan:
    name: Container vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: backend-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-image.outputs.image-tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Run Trivy (SARIF for code scanning)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-image.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: backend-app

  push-image:
    name: Push image to ghcr.io
    runs-on: ubuntu-latest
    needs: [build-image, trivy-scan]
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-image

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          docker push ${{ needs.build-image.outputs.image-tag }}
          docker push ${{ needs.build-image.outputs.dev-tag }}
          docker push ${{ needs.build-image.outputs.staging-tag }}

  trivy-scan-db:
    name: Container vulnerability scan - db (Trivy)
    runs-on: ubuntu-latest
    needs: build-db-image
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: backend-db-image

      - name: Load image
        run: docker load -i db-image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-db-image.outputs.image-tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Run Trivy (SARIF for code scanning)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-db-image.outputs.image-tag }}
          format: sarif
          output: trivy-db-results.sarif
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-db-results.sarif
          category: backend-db

  push-db-image:
    name: Push database image to ghcr.io
    runs-on: ubuntu-latest
    needs: [build-db-image, trivy-scan-db]
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-db-image

      - name: Load image
        run: docker load -i db-image.tar

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          docker push ${{ needs.build-db-image.outputs.image-tag }}
          docker push ${{ needs.build-db-image.outputs.dev-tag }}
          docker push ${{ needs.build-db-image.outputs.staging-tag }}
