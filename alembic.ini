[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally left unset here — alembic/env.py reads the
# real connection string from app.core.config.get_settings() (i.e. the
# DATABASE_URL env var), so there's exactly one place the DB URL is
# configured instead of two that could drift apart.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
